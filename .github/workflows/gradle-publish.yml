name: Gradle Package

on: [ push, pull_request ]

jobs:
  build:
  
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build

      - name: Upload build artifacts api
        uses: actions/upload-artifact@v7
        with:
          name: api-build
          path: build/libs/blueprint-api-*.jar

      - name: Upload build artifacts configuration
        uses: actions/upload-artifact@v7
        with:
          name: configuration-build
          path: build/libs/blueprint-configuration-*.jar

      - name: Upload build artifacts helper
        uses: actions/upload-artifact@v7
        with:
          name: helper-build
          path: build/libs/blueprint-helper-*.jar

      - name: Upload build artifacts paper
        uses: actions/upload-artifact@v7
        with:
          name: paper-build
          path: build/libs/blueprint-paper-*.jar

      - name: Upload build artifacts velocity
        uses: actions/upload-artifact@v7
        with:
          name: velocity-build
          path: build/libs/blueprint-velocity-*.jar

      - name: Upload build artifacts menu
        uses: actions/upload-artifact@v7
        with:
          name: menu-build
          path: build/libs/blueprint-menu-*.jar

      - name: Upload build artifacts command
        uses: actions/upload-artifact@v7
        with:
          name: command-build
          path: build/libs/blueprint-command-*.jar

      - name: Upload build artifacts yaml-configuration
        uses: actions/upload-artifact@v7
        with:
          name: yaml-configuration-build
          path: build/libs/blueprint-yaml-configuration-*.jar

      - name: Upload build artifacts json-configuration
        uses: actions/upload-artifact@v7
        with:
          name: json-configuration-build
          path: build/libs/blueprint-json-configuration-*.jar

      - name: Upload build artifacts packet-menu
        uses: actions/upload-artifact@v7
        with:
          name: packet-menu-build
          path: build/libs/blueprint-packet-menu-*.jar

      - name: Upload build artifacts bukkit-menu
        uses: actions/upload-artifact@v7
        with:
          name: bukkit-menu-build
          path: build/libs/blueprint-bukkit-menu-*.jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
